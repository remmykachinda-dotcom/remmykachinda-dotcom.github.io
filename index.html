<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MamaCare - Afya ya Mama na Mtoto</title>
<style>
body{font-family:Arial;background:#e8f5e9;margin:0;padding:10px}
.wrap{max-width:600px;margin:auto;background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 0 10px #aaa}
.top{background:#2e7d32;color:#fff;padding:15px;text-align:center}
#chat{padding:15px;height:400px;overflow-y:auto;background:#f9f9f9}
.msg{margin:8px 0;padding:10px;border-radius:10px;white-space:pre-line}
.me{background:#c8e6c9;text-align:right}
.bot{background:#fff;border:1px solid #ddd}
.input{display:flex;gap:5px;padding:10px}
input{flex:1;padding:12px;border-radius:10px;border:1px solid #ccc}
button{padding:12px;border-radius:10px;background:#2e7d32;color:#fff;border:none}
.btns{display:flex;flex-wrap:wrap;gap:5px;padding:0 10px 10px}
.btns button{background:#fff;color:#000;border:1px solid #2e7d32}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h2>🤰 Afya ya Mama na Mtoto</h2><p>Msaidizi wako wa Afya - Andika swali au chagua hapa chini</p></div>
<div class="btns">
<button onclick="ask('Chanjo za mtoto')">💉 Chanjo za mtoto</button>
<button onclick="ask('Mimba')">🤰 Mimba</button>
<button onclick="ask('Lishe bora')">🥦 Lishe bora</button>
<button onclick="ask('Dalili za hatari')">⚠️ Dalili za hatari</button>
<button onclick="ask('Kunyonyesha')">🤱 Kunyonyesha</button>
<button onclick="ask('Uzazi wa mpango')">👨‍👩‍👧 Uzazi wa mpango</button>
</div>
<div id="chat"><div class="msg bot">Karibu! Mimi ni MamaCare. Andika swali lako hapa chini, kwa mfano: chanjo, mimba, lishe.</div></div>
<div class="input"><input id="q" placeholder="Andika swali hapa..."><button onclick="send()">Tuma</button></div>
</div>
<script>
function addMsg(text, cls){
  let d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  document.getElementById("chat").appendChild(d);
  document.getElementById("chat").scrollTop = 99999;
}
function ask(txt){
  document.getElementById("q").value = txt;
  send();
}
function send(){
  let q = document.getElementById("q").value.trim();
  if(!q) return;
  addMsg(q, "me");
  document.getElementById("q").value = "";
  let t = q.toLowerCase();
  let a = "Samahani, sijaelewa vizuri. Jaribu kuandika: chanjo, mimba, lishe, kunyonyesha, dalili za hatari, uzazi wa mpango.";
  if(t.includes("chanjo")){ a = "💉 CHANJO ZA MTOTO:\n\n• Siku ya kuzaliwa: BCG na Polio 0\n• Wiki 6: Penta 1, Polio 1, Pneumo 1, Rota 1\n• Wiki 10: Penta 2, Polio 2, Pneumo 2, Rota 2\n• Wiki 14: Penta 3, Polio 3, Pneumo 3, Rota 3\n• Miezi 9: Surua na Rubella 1\n• Miezi 18: Surua na Rubella 2\n\nMpeleke mtoto kliniki kila mara, na ubebe kadi ya chanjo."; }
  else if(t.includes("mimba")){ a = "🤰 MIMBA:\n\n• Nenda kliniki mara 8 wakati wa ujauzito.\n• Kula lishe bora, lala na chandarua chenye dawa.\n• Meza vidonge vya damu (Iron + Folic) kila siku.\n• Nenda hospitali haraka ukiona damu, maumivu makali, au mtoto hachezi."; }
  else if(t.includes("lishe")){ a = "🥦 LISHE BORA:\n\n• Kula mchanganyiko: wali, maharage, mboga, matunda, nyama au samaki, maziwa.\n• Kunywa maji mengi.\n• Epuka pombe na sigara kabisa wakati wa mimba na kunyonyesha."; }
  else if(t.includes("kunyonyesha") || t.includes("maziwa")){ a = "🤱 KUNYONYESHA:\n\n• Mnyonyeshe mtoto maziwa ya mama pekee kwa miezi 6 ya kwanza.\n• Mnyonyeshe ndani ya saa 1 baada ya kujifungua.\n• Mnyonyeshe mara 8-12 kwa siku.\n• Endelea kumnyonyesha hadi miaka 2 na kuongeza vyakula vingine baada ya miezi 6."; }
  else if(t.includes("hatari") || t.includes("dalili")){ a = "⚠️ DALILI ZA HATARI - NENDA HOSPITALI HARAKA:\n\nMama: damu nyingi, homa kali, kichwa kuuma sana, macho kufifia, mikono na uso kuvimba, maji kutoka kabla ya wakati.\n\nMtoto: homa kali, kushindwa kunyonya, kupumua kwa shida, kuhara na kutapika sana, kitovu kuvimba au kutoa usaha."; }
  else if(t.includes("uzazi") || t.includes("mpango") || t.includes("familia")){ a = "👨‍👩‍👧 UZAZI WA MPANGO:\n\n• Kuna njia nyingi: sindano, vidonge, kipandikizi, kitanzi, kondomu.\n• Nenda kliniki uongee na muuguzi akuchagulie inayokufaa.\n• Kupanga uzazi kunamkinga mama na mtoto, na kunasaidia familia kulea vizuri."; }
  else if(t.includes("salamu") || t.includes("habari") || t.includes("mambo")){ a = "Habari! Niko vizuri, karibu sana. Uliza swali kuhusu chanjo, mimba, lishe au kunyonyesha."; }
  addMsg(a, "bot");
}
</script>
</body>
</html>
